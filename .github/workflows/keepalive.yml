name: keepalive

# GitHub switches scheduled workflows off after 60 days without repository activity. This commits a timestamp once a month so the studio keeps running.
on:
  schedule:
    - cron: '17 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: |
          date -u +%FT%TZ > .keepalive
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add .keepalive
          git commit -m "keepalive" || true
          git push
